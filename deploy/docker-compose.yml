# ============================================================
# 开放管理后台 — 单机生产部署（nginx + app + init + mysql + redis）
# Copyright (c) 2026 erik <erik@erik.xyz> — https://erik.xyz
#
# 使用前先执行 ./generate-secrets.sh 生成 .env、密钥、证书与数据目录。
# 所有持久化数据均以宿主机目录挂载在 ./data 下，不使用命名卷。
# ============================================================

name: open-admin

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================================
  # MySQL 8.0 — 仅容器网络内可访问，不映射宿主机端口
  # ============================================================
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --skip-log-bin
      - --log-error=/var/log/mysql/error.log
      # MySQL 入口脚本只 chown slow-query-log-file 等配置所在目录；
      # 同目录指定该文件后，/var/log/mysql 会被自动创建并授权给 mysql 用户
      # （慢查询日志默认关闭，不会产生额外日志内容）
      - --slow-query-log-file=/var/log/mysql/slow.log
      - --innodb-buffer-pool-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./data/mysql-logs:/var/log/mysql
      - ./mysql/init-app-user.sh:/docker-entrypoint-initdb.d/00-app-user.sh:ro
      - ../database/install.sql:/docker-entrypoint-initdb.d/10-install.sql:ro
    healthcheck:
      # 通过 TCP 探测：初始化阶段的临时实例使用 --skip-networking，避免提前标记为健康
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging: *default-logging

  # ============================================================
  # Redis 7 — AOF 持久化，仅容器网络内可访问
  # ============================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *default-logging

  # ============================================================
  # init — 一次性初始化管理员（幂等），完成后退出
  # ============================================================
  init:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    command: ["php", "/app/init-admin.php"]
    env_file: .env
    volumes:
      - ./init-admin.php:/app/init-admin.php:ro
      - ./data/runtime:/app/runtime
    depends_on:
      mysql:
        condition: service_healthy
    logging: *default-logging

  # ============================================================
  # app — webman（PHP 8.3），监听容器内 8791，由 nginx 反向代理
  # ============================================================
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # 代码与 vendor 使用镜像内 /app，仅挂载运行时可写目录
      - ./data/runtime:/app/runtime
      - ./data/upload:/app/public/upload
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8791/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ============================================================
  # nginx — 80/443 入口，TLS 终结，静态官网 + 反向代理
  # ============================================================
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/tls:/etc/nginx/certs:ro
      - ../site:/app/open-admin:ro
      - ../public:/app/public:ro
      - ./data/nginx/logs:/var/log/nginx
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
