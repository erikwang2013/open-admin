# ============================================================
# 开放管理后台 — 单机生产部署（nginx + app + init + mysql + redis + backup）
# Copyright (c) 2026 erik <erik@erik.xyz> — https://erik.xyz
#
# 使用前先执行 ./generate-secrets.sh 生成 .env、env/*.env、密钥、证书与数据目录。
#   .env            compose 插值（域名/端口/宿主机 UID）与 OFFSITE_TARGET（宿主机同步脚本），不含密钥
#   env/*.env       各服务独立的运行环境（600），仅对应容器可见
# 所有持久化数据均以宿主机目录挂载在 ./data 下，不使用命名卷。
#
# 资源限制：compose v2 会把 pids_limit 归并进 deploy.resources.limits.pids；
# 存在 limits 块时只写 pids_limit 会报 “can't set distinct values”，因此两处
# 数值必须保持一致（修改 PID 上限时同时改这两个键）。
# ============================================================

name: open-admin

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================================
  # MySQL 8.0 — 仅容器网络内可访问，不映射宿主机端口
  # 日志直接输出到 stderr，由 Docker 的 json-file 轮转接管
  # ============================================================
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --skip-log-bin
      - --innodb-buffer-pool-size=256M
    env_file: ./env/mysql.env
    volumes:
      - ./data/mysql:/var/lib/mysql
      # 排在 10-install.sql 之后：备份用户的表级 DELETE 授权要求表已存在
      - ./mysql/init-app-user.sh:/docker-entrypoint-initdb.d/20-app-user.sh:ro
      - ../database/install.sql:/docker-entrypoint-initdb.d/10-install.sql:ro
    healthcheck:
      # 通过 TCP 做认证查询：mysqladmin ping 在密码错误时也可能返回 0
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.5"
          pids: 512
    pids_limit: 512
    logging: *default-logging

  # ============================================================
  # Redis 7 — AOF 持久化，仅容器网络内可访问
  # 密码从容器内环境变量展开，不在宿主机 compose 插值中出现
  # ============================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    env_file: ./env/redis.env
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          # 容器上限 384M = maxmemory 256M + 约 128M 余量：
          # AOF 重写/fork、客户端缓冲与内存碎片不计入 maxmemory，上限必须高于它。
          # 修改时同步调整 command 中的 --maxmemory，并保留至少 128M 余量。
          memory: 384M
          cpus: "0.5"
          pids: 128
    pids_limit: 128
    logging: *default-logging

  # ============================================================
  # init — 一次性初始化管理员（幂等），完成后退出
  # ============================================================
  init:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    command: ["php", "/app/init-admin.php"]
    env_file: ./env/init.env
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./init-admin.php:/app/init-admin.php:ro
      - ./data/runtime:/app/runtime
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
          pids: 128
    pids_limit: 128
    logging: *default-logging

  # ============================================================
  # app — webman（PHP 8.3），监听容器内 8791，由 nginx 反向代理
  # ============================================================
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./env/app.env
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # 代码与 vendor 使用镜像内 /app，仅挂载运行时可写目录
      - ./data/runtime:/app/runtime
      - ./data/upload:/app/public/upload
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8791/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256
    pids_limit: 256
    logging: *default-logging

  # ============================================================
  # backup — 每日逻辑备份 + 上传文件归档（保留 30 天），
  #          并清理 180 天前的操作日志。使用最小权限备份用户。
  # ============================================================
  backup:
    image: mysql:8.0
    restart: unless-stopped
    env_file: ./env/backup.env
    # 以宿主机用户运行，备份文件不会归 root 所有
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /backups
        # 清理异常退出遗留的临时文件（仅本服务写入 /backups）
        rm -f /backups/.backup_*.sql /backups/.backup_*.sql.gz /backups/.upload_*.tar.gz
        while true; do
          ts="$$(date +%Y%m%d_%H%M%S)"

          # 数据库：最小权限用户 + 一致性快照，不导出 routines
          # 先写临时文件再改名，异地同步不会读到写了一半的 .gz
          tmp="/backups/.backup_$${ts}.sql"
          tmp_gz="/backups/.backup_$${ts}.sql.gz"
          out="/backups/backup_$${ts}.sql.gz"
          if MYSQL_PWD="$$DB_BACKUP_PASSWORD" mysqldump -h mysql -u"$$DB_BACKUP_USERNAME" \
              --single-transaction --no-tablespaces --default-character-set=utf8mb4 \
              "$$MYSQL_DATABASE" > "$$tmp"; then
            if gzip -c "$$tmp" > "$$tmp_gz"; then
              mv "$$tmp_gz" "$$out"
              echo "[backup] $$out"
            else
              rm -f "$$tmp" "$$tmp_gz"
              echo "[backup] gzip 失败" >&2
            fi
          else
            echo "[backup] mysqldump 失败" >&2
          fi
          rm -f "$$tmp"

          # 上传文件：只读挂载，打包失败不影响数据库备份
          upload_tmp="/backups/.upload_$${ts}.tar.gz"
          upload_out="/backups/upload_$${ts}.tar.gz"
          if tar -czf "$$upload_tmp" -C /upload .; then
            mv "$$upload_tmp" "$$upload_out"
            echo "[backup] $$upload_out"
          else
            rm -f "$$upload_tmp"
            echo "[backup] upload 打包失败" >&2
          fi

          # 操作日志保留 180 天；每轮最多删 10000 行，失败只记日志
          if MYSQL_PWD="$$DB_BACKUP_PASSWORD" mysql -h mysql -u"$$DB_BACKUP_USERNAME" \
              "$$MYSQL_DATABASE" \
              -e "DELETE FROM erik_operation_log WHERE created_at < DATE_SUB(NOW(), INTERVAL 180 DAY) LIMIT 10000"; then
            echo "[backup] 已清理 180 天前的操作日志"
          else
            echo "[backup] 操作日志清理失败" >&2
          fi

          find /backups -name 'backup_*.sql.gz' -mtime +30 -delete
          find /backups -name 'upload_*.tar.gz' -mtime +30 -delete
          sleep 86400
        done
    volumes:
      - ./data/backups:/backups
      - ./data/upload:/upload:ro
    depends_on:
      mysql:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
          pids: 128
    pids_limit: 128
    logging: *default-logging

  # ============================================================
  # nginx — 80/443 入口，TLS 终结，静态官网 + 反向代理
  # 日志走 stdout/stderr，由 Docker 的 json-file 轮转接管
  # ============================================================
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/tls:/etc/nginx/certs:ro
      - ../site:/app/open-admin:ro
      - ../public:/app/public:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
          pids: 128
    pids_limit: 128
    logging: *default-logging
