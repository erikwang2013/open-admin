# ============================================================
# 开放管理后台 — 单机生产部署 Nginx 配置
# Copyright (c) 2026 erik <erik@erik.xyz> — https://erik.xyz
#
# 挂载到 /etc/nginx/conf.d/default.conf。
# HTTP 仅保留 ACME 校验与健康检查，其余 301 到 HTTPS。
# ============================================================

# --- 限流（http 上下文） ---
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=3r/s;
limit_req_status 429;

# ============================================================
# HTTP → HTTPS
# ============================================================
server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 10m;

    # 容器健康检查（不跳转、不写访问日志）
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # 证书续签校验文件，不重定向
    location ^~ /.well-known/acme-challenge/ {
        root /app/public;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# HTTPS 主站
# ============================================================
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;

    # --- 请求限制（与后端 SecurityFilter 10MB 一致） ---
    client_max_body_size 10m;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # --- 安全响应头 ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # app 主机名延迟到请求时解析（Docker 内嵌 DNS），无 app 容器时 nginx -t 也能通过
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $webman_upstream app:8791;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # --- 禁止访问敏感文件 / 隐藏文件 ---
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* \.(?:sql|log|env|yml|yaml|bak|swp|old|dist)$ {
        deny all;
        return 404;
    }

    # --- 登录接口独立限流 ---
    location = /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://$webman_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --- 静态官网（../site 挂载到 /app/open-admin） ---
    location = /open-admin {
        return 301 /open-admin/;
    }

    location = /open-admin/en {
        return 301 /open-admin/en/;
    }

    location /open-admin/assets/ {
        root /app;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /open-admin/en/assets/ {
        root /app;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /open-admin/en/ {
        root /app;
        index index.html;
        try_files $uri $uri/ =404;
        error_page 404 /open-admin/en/404.html;
        expires -1;
    }

    location /open-admin/ {
        root /app;
        index index.html;
        try_files $uri $uri/ =404;
        error_page 404 /open-admin/404.html;
        expires -1;
    }

    # --- 反向代理到 webman ---
    location / {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://$webman_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_redirect off;
    }

    # --- Gzip ---
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
