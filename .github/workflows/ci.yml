name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # PHP — 语法检查 + 单元测试
  # ============================================================
  php:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: open_admin
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, redis, mbstring, gd, xml, dom, xmlwriter
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy .env
        run: cp .env.example .env

      - name: Init database
        run: |
          mysql -h 127.0.0.1 -u root -proot open_admin < database/install.sql

      - name: PHP Syntax Check
        run: find app config -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: PHPUnit Tests
        run: php vendor/bin/phpunit --no-configuration --bootstrap tests/bootstrap.php tests/

  # ============================================================
  # Flutter — 静态分析
  # ============================================================
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  # ============================================================
  # Release — 推送到 main 后自动打 tag + 创建 Release
  # 版本号基于最新 tag 的 patch 位增量（v2.1.0 → v2.1.1）
  # 仅创建 tag 和 Release，不打包应用
  # ============================================================
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [php, flutter]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get latest version and bump patch
        id: version
        run: |
          LATEST=$(git tag --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            NEW_VERSION="v1.0.0"
          else
            V=${LATEST#v}
            MAJOR=${V%%.*}; REST=${V#*.}; MINOR=${REST%%.*}; PATCH=${REST#*.}
            NEW_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest tag: ${LATEST:-none} -> New version: $NEW_VERSION"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.new_version }}" --target "$GITHUB_SHA" --generate-notes
