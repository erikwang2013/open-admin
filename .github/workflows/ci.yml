# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # PHP — 语法检查 + 单元测试
  # ============================================================
  php:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: open_admin
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, redis, mbstring, gd, xml, dom, xmlwriter
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy .env
        run: cp .env.example .env

      - name: Init database
        run: |
          mysql -h 127.0.0.1 -u root -proot open_admin < database/install.sql

      - name: PHP Syntax Check
        run: find app config -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: PHPUnit Tests
        run: |
          if [ -f tests/bootstrap.php ]; then
            php vendor/bin/phpunit --no-configuration --bootstrap tests/bootstrap.php tests/
          else
            echo "tests/bootstrap.php 不存在，跳过 PHPUnit。"
          fi

  # ============================================================
  # Flutter — 静态分析
  # ============================================================
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

  # ============================================================
  # Docker — 镜像运行依赖 + Compose/Nginx 配置校验
  # ============================================================
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t open-admin:ci .

      - name: Check PHP extensions
        run: |
          modules="$(docker run --rm open-admin:ci php -m)"
          for ext in redis zip gd; do
            echo "$modules" | grep -qix "$ext" || { echo "缺少 PHP 扩展: $ext"; exit 1; }
          done
          docker run --rm open-admin:ci php -r '
            $info = gd_info();
            if (empty($info["FreeType Support"]) || empty($info["JPEG Support"])) {
                fwrite(STDERR, "GD 缺少 FreeType 或 JPEG 支持\n");
                exit(1);
            }
            echo "PHP 扩展检查通过\n";
          '

      - name: Validate root compose
        run: docker compose --env-file .env.docker config --quiet

      - name: Validate deploy compose and nginx
        run: |
          TMP="$(mktemp -d)"
          cp -a deploy "$TMP/deploy"
          rm -rf "$TMP/deploy/env" "$TMP/deploy/secrets" "$TMP/deploy/data"
          "$TMP/deploy/generate-secrets.sh"
          docker compose --project-directory "$TMP/deploy" -f "$TMP/deploy/docker-compose.yml" config --quiet
          docker run --rm \
            -v "$TMP/deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$TMP/deploy/secrets/tls:/etc/nginx/certs:ro" \
            nginx:alpine nginx -t
          docker run --rm \
            -v "$PWD/docs/nginx-security.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

  # ============================================================
  # Release — 推送到 main 后自动打 tag + 创建 Release
  # 版本号基于最新 tag 的 patch 位增量（v2.1.0 → v2.1.1）
  # 仅创建 tag 和 Release，不打包应用
  # ============================================================
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [php, flutter, docker]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get latest version and bump patch
        id: version
        run: |
          LATEST=$(git tag --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            NEW_VERSION="v1.0.0"
          else
            V=${LATEST#v}
            MAJOR=${V%%.*}; REST=${V#*.}; MINOR=${REST%%.*}; PATCH=${REST#*.}
            NEW_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest tag: ${LATEST:-none} -> New version: $NEW_VERSION"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.new_version }}" --target "$GITHUB_SHA" --generate-notes
